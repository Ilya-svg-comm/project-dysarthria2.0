services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      PGDATA: "/var/lib/postgresql/data/pgdata"
    env_file:
      - .env.docker
    volumes:
      - data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    # Официальный образ minio/minio больше недоступен на Docker Hub (2026).
    # elestio/minio — совместимая сборка MinIO с тем же entrypoint/API.
    image: elestio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.docker
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  backend:
    build: ./backend
    container_name: backend
    command: gunicorn project.wsgi:application --bind 0.0.0.0:8001
    restart: unless-stopped
    volumes:
      - ./backend/:/usr/src/app/
      - static_volume:/usr/src/app/static
      - media_volume:/usr/src/app/media
    ports:
      - "8001:8001"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    volumes:
      - static_volume:/usr/src/app/static
      - media_volume:/usr/src/app/media
    depends_on:
      - backend
    networks:
      - app_network
    ports:
      - "80:80"

volumes:
  data:
  static_volume:
  media_volume:
  minio_data:

networks:
  app_network:
    driver: bridge
